
name: Java CI/CD Pipeline to Tomcat

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: [self-hosted, linux]

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Ensure Maven is installed
      - name: Ensure Maven is installed
        run: |
          if ! command -v mvn &> /dev/null; then
            echo "Installing Maven..."
            if command -v dnf &> /dev/null; then
              sudo dnf install -y maven perl-Digest-SHA
            elif command -v yum &> /dev/null; then
              sudo yum install -y maven perl-Digest-SHA
            else
              echo "Unsupported package manager"
              exit 1
            fi
          fi
          mvn -version

      # 4. Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 5. Build WAR file
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 6. Check WAR file
      - name: Verify WAR file
        run: |
          ls -lh target/*.war

      # 7. Upload WAR artifact
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: target/*.war
          if-no-files-found: error

  deploy:
    runs-on: [self-hosted, linux]
    needs: build
    environment: production

    steps:
      # 8. Download WAR artifact
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp
          path: deploy

      # 9. Deploy WAR to Tomcat
      - name: Deploy to Tomcat
        env:
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |
          WAR_FILE=$(find deploy -maxdepth 1 -name "*.war" -print -quit)

          if [ -z "$WAR_FILE" ]; then
            echo "WAR file not found!"
            exit 1
          fi

          echo "Deploying WAR file to Tomcat..."

          curl --fail --silent --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            --upload-file "$WAR_FILE" \
            "http://${TOMCAT_HOST}/manager/text/deploy?path=/myapp&update=true"

      # 10. Verify deployment
      - name: Verify deployment
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |
          echo "Checking application..."

          curl --fail --silent --show-error \
            "http://${TOMCAT_HOST}/myapp/"

          echo "Application deployed successfully!"
